apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml
spec:
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
---
